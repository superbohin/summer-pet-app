name: Family sync append

on:
  workflow_dispatch:
    inputs:
      event:
        description: Base64-encoded signed and encrypted family event envelope
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: family-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate-and-append:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the private data repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Validate and append the event
        env:
          EVENT_BASE64: ${{ inputs.event }}
        run: node --experimental-strip-types scripts/github-family-sync-action.mjs

      - name: Commit the append-only event
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- events
          git diff --cached --quiet && {
            echo "No event was appended."
            exit 1
          }
          git commit -m "Append validated family event"
          git push
